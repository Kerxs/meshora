name: Package

# 出要发布的东西：Windows 客户端的安装程序（自己的液态玻璃安装程序 meshora-setup，
# 带着核对过哈希和签名的 wintun.dll）和安卓客户端的 APK。只发这两个平台。
# 另外编一份 Linux 服务端，只给官方服务器升级用，不发布。
# 编译和 lint 在 Rust 那个工作流里已经做了，这里只管出包 —— 改到代码时、打标签时、手动触发时才跑。
#
# 发版：改好 Cargo.toml 的版本推到 main，手动触发这个工作流、勾上"发版"。所有东西编完、模拟器里连网通过之后，
# 才建一个**草稿** Release 并附上全部文件；草稿不建标签，外面什么都看不到。人核对过再点发布，
# 标签和 Release 这时一起出现 —— 不先推标签，免得标签先露面、附件还在编
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "scripts/fetch-wintun.ps1"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "发版：全部通过后建草稿 Release（版本号取自 Cargo.toml）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update

      # 发版时先查这个版本号没发过：忘了改 Cargo.toml 的版本，就会撞上已有的 Release
      - name: 核对版本
        if: inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ((cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'meshora-desktop').version
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "v$version 已经有 Release 了：先改 Cargo.toml 的版本号再发"
            exit 1
          }
          exit 0

      # 载荷目录：安装程序要装的全部文件。wintun.dll 核对过哈希和 WireGuard LLC 的签名
      - name: wintun.dll
        shell: pwsh
        run: scripts/fetch-wintun.ps1 -Destination payload

      - name: 客户端
        run: cargo build --release --locked -p meshora-desktop

      # 安装程序把载荷目录整个编进自己（MESHORA_SETUP_PAYLOAD，见 crates/meshora-setup/build.rs），
      # 装到 Program Files（只有管理员能写，wintun.dll 放在那里才可信）。
      #
      # 不出免安装的 zip：客户端以管理员身份运行、从自己旁边加载 wintun.dll，
      # 解压到"下载"这类普通用户可写的目录，就等于把管理员权限交给了能写那个目录的任何进程
      - name: 安装程序
        shell: pwsh
        run: |
          Copy-Item target\release\meshora.exe, LICENSE, THIRD-PARTY-NOTICES.md payload\
          Get-ChildItem payload | Format-Table Name, Length
          $env:MESHORA_SETUP_PAYLOAD = (Resolve-Path payload).Path
          cargo build --release --locked -p meshora-setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = ((cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'meshora-setup').version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\meshora-setup.exe "dist\Meshora-$version-setup.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: meshora-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  # 官方服务器（Linux 云主机）用的服务端：协调服务 meshora-coord，带上 meshorad（生成服务器私钥用）。
  # **不发布**：产物名不以 meshora- 开头，release job 收不到它；升级官方服务器时从这次运行的产物里下载，
  # 交给 scripts/deploy-hub.sh。用 musl 静态链接：不挑发行版、不挑 glibc 版本
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-musl
      # 发出去的程序不带调试符号，小一半多
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v7
      # ring 里有 C 和汇编，要 musl 的 C 编译器
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install --no-self-update && rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p meshora-coord -p meshorad

      - name: 打包
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "meshora-coord") | .version')
          name="meshora-server-$version-linux-x86_64"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/meshora-coord" "target/$TARGET/release/meshorad" LICENSE "dist/$name/"
          # 真的是静态的（x86_64 上 file 说的是 static-pie linked）、在这台机器上跑得起来
          file "dist/$name/meshora-coord" | tee /dev/stderr | grep -qE "statically linked|static-pie linked"
          "dist/$name/meshorad" genkey | "dist/$name/meshora-coord" pubkey
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: hub-server-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  # 安卓客户端：和桌面端同一份界面、同一套节点代码，网卡由 VpnService 建（crates/meshora-android、crates/meshora-vpn）。
  # 一个 APK 里带 arm64（手机）和 x86_64（模拟器）两份。Android 工程由 tauri android init 每次现生成，不入库
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update && rustup target add aarch64-linux-android x86_64-linux-android

      # runner 自带 Android SDK、NDK 和 JDK 17
      - name: APK
        working-directory: crates/meshora-android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # 打包工具的版本钉在 package-lock.json 里：它会被拿来执行，供应链的账要算清。
          # Gradle 编 Rust 时还会回调 npm run tauri，所以得是装在这里的，不能用 npx 临时拉
          npm ci --no-audit --no-fund
          npm run tauri -- android init --ci
          npm run tauri -- icon ../meshora-desktop/icons/icon.png
          npm run tauri -- android build --ci --apk --target aarch64 --target x86_64
          find gen/android/app/build/outputs -name '*.apk' -exec ls -la {} \;

      # 签名。安卓只让同一把钥匙签的新版本覆盖安装：发版用仓库里存着的那把（ANDROID_KEYSTORE），
      # 换了就没法升级。没配（比如别人的 fork、PR）就现生成一把，只能拿来试装
      - name: 签名
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAG_BUILD: ${{ inputs.release == true }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "meshora-android") | .version')
          apk=$(find crates/meshora-android/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [[ -n $KEYSTORE ]]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/meshora.p12"
          elif [[ $TAG_BUILD == true ]]; then
            echo "发版要用固定的签名钥匙：仓库里没有 ANDROID_KEYSTORE" >&2
            exit 1
          else
            KS_PASS=throwaway
            openssl req -x509 -newkey rsa:3072 -nodes -days 30 -subj "/CN=Meshora test build" \
              -keyout "$RUNNER_TEMP/k.pem" -out "$RUNNER_TEMP/c.pem"
            openssl pkcs12 -export -inkey "$RUNNER_TEMP/k.pem" -in "$RUNNER_TEMP/c.pem" \
              -name meshora -passout "pass:$KS_PASS" -out "$RUNNER_TEMP/meshora.p12"
            echo "::warning::没有 ANDROID_KEYSTORE，用的是临时钥匙：这个 APK 只能试装，不能升级"
          fi
          mkdir -p dist
          "$tools/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KS_PASS" "$tools/apksigner" sign --ks "$RUNNER_TEMP/meshora.p12" --ks-type PKCS12 \
            --ks-pass env:KS_PASS --out "dist/Meshora-$version-android.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "dist/Meshora-$version-android.apk"
          rm -f "$RUNNER_TEMP/meshora.p12" "$RUNNER_TEMP/k.pem"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: meshora-android
          path: dist/*.apk
          if-no-files-found: error

  # 在模拟器里装上、打开，再真的连一次：CI 这边在官方服务器上建一个网络，模拟器里点界面凭网络码加入，
  # 这边 ping 它，系统回了就说明 VpnService 的网卡、Rust 数据面、经服务器的那条路都通。最后解散网络
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MESHORA_HUB: "3hxhTS9dwMrNCqPzJzqOheZMk8qYepYn9QMmxKhPkgU=@39.108.210.40:7443"
      MESHORA_CODE_FILE: ${{ github.workspace }}/code.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: meshora-android
          path: apk
      - name: 另一边（后台）：建网络、等安卓加入、ping 它
        run: |
          rustup toolchain install --no-self-update
          cargo test -p meshora-control --test e2e --locked --no-run
          nohup cargo test -p meshora-control --test e2e --locked -- --ignored an_android_phone --nocapture             > peer.log 2>&1 &
          echo $! > peer.pid
      # 模拟器要 KVM
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # 不带 Google 服务的原生镜像：Google 服务在模拟器开机后常自己重启，WebView 依赖它的字体提供程序，
          # 会被一起结束。Meshora 用不到 Google 服务
          target: default
          disable-animations: true
          script: bash scripts/android-smoke.sh apk/*.apk smoke code.txt
      - name: 另一边收到了回应
        if: always()
        run: |
          for _ in $(seq 1 150); do kill -0 "$(cat peer.pid)" 2>/dev/null || break; sleep 2; done
          cat peer.log
          cp peer.log smoke/ 2>/dev/null || true
          grep -q "安卓回了 ping" peer.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: smoke/
          if-no-files-found: ignore

  # 发版：前面全部通过才到这里，建草稿 Release（不建标签）。人核对过再发布，标签那时才出现。
  # 0.x 和带 "-" 的版本标成预发布
  release:
    if: inputs.release
    needs: [desktop, server, android, android-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: meshora-*
          path: dist
          merge-multiple: true

      # 版本号取自编好的安装程序的文件名（它来自 Cargo.toml）
      - name: 版本号
        run: |
          setup=$(ls dist/Meshora-*-setup.exe)
          version=${setup#dist/Meshora-}
          version=${version%-setup.exe}
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "发版 v$version"

      # 客户端的自动更新读它（crates/meshora-desktop/src/update.rs）。每个平台签一段
      # "meshora-update\n平台\n版本\nSHA-256"：私钥只在仓库的 Secret 里，公钥写在客户端里
      - name: 更新清单
        working-directory: dist
        env:
          KEY: ${{ secrets.MESHORA_UPDATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z $KEY ]]; then
            echo "仓库里没有 MESHORA_UPDATE_KEY：发出去的版本没法被客户端自动更新" >&2
            exit 1
          fi
          version=${TAG#v}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/update-key.pem"
          entry() {
            local platform=$1 file=$2 sha sig
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            printf 'meshora-update\n%s\n%s\n%s' "$platform" "$version" "$sha" > "$RUNNER_TEMP/message"
            sig=$(openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update-key.pem" -rawin -in "$RUNNER_TEMP/message" | base64 -w0)
            jq -n --arg url "$base/$file" --arg sha256 "$sha" --arg signature "$sig" \
              '{url: $url, sha256: $sha256, signature: $signature}'
          }
          windows=$(ls Meshora-*-setup.exe)
          android=$(ls Meshora-*-android.apk)
          jq -n --arg version "$version" \
            --arg notes "Meshora $version：见 https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson windows "$(entry windows "$windows")" \
            --argjson android "$(entry android "$android")" \
            '{version: $version, notes: $notes, windows: $windows, android: $android}' > latest.json
          rm -f "$RUNNER_TEMP/update-key.pem" "$RUNNER_TEMP/message"
          cat latest.json

      - name: 哈希
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS.txt

      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **还在早期**：没有经过安全审查，还没在两台真的电脑之间拿真的游戏联机试过。

          ## 玩家：Windows 桌面客户端

          `Meshora-*-setup.exe`：装到 `Program Files`，运行时需要管理员权限（要建虚拟网卡）。
          装过旧版本的直接运行它就是升级，网络、名字、私钥都留着。卸载在"设置 → 应用"里。

          - **安装程序没有代码签名**，SmartScreen 会提示"未知发布者"
          - 要有 Microsoft Edge WebView2 运行时（Windows 11 自带；没有时安装程序会给出下载地址）
          - 没有免安装版，理由见[威胁模型](https://kerxs.github.io/meshora/guide/threat-model)

          用法见[桌面客户端](https://kerxs.github.io/meshora/guide/desktop)。

          ## 玩家：安卓客户端

          `Meshora-*-android.apk`：和桌面端同一个界面，靠系统的 VPN 功能组网（只接管网里的地址，上网不受影响）。
          第一次连接时系统会问"是否允许 Meshora 设置 VPN 连接"。还没在真的手机上试过。

          ## 自动更新

          客户端每次打开都查一次 `latest.json`，开着的话之后每 6 小时再查（设置里可以关）；查到新版本会弹窗问要不要更新。新版本的安装包有 Ed25519 签名，核对过才装：
          Windows 上点一下就装好、自动重新打开；安卓上交给浏览器下载，系统安装器会核对 APK 的签名。

          ## 核对

          下载后核对 SHA-256，和 `SHA256SUMS.txt` 里的对得上再用：

          ```powershell
          Get-FileHash -Algorithm SHA256 .\Meshora-*-setup.exe
          ```

          EOF
          prerelease=()
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          # --target：发布时在这个提交上建标签（草稿阶段没有标签）
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft "${prerelease[@]}" \
            --title "Meshora $TAG" --notes-file notes.md
