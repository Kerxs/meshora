name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支上推了新提交，旧的那次没必要跑完
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# 不做缓存：从头编译整轮也就一分钟左右，不值得为它多引一个 action

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # runner 自带 rustup。不带参数的 install 按 rust-toolchain.toml 装，连同里面列的组件
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 契约写在文档注释里，文档里的断链也要拦下来
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      # 一个平台挂了另一个也要跑完：平台相关的问题正是要看全的
      fail-fast: false
      matrix:
        # Windows 是第一个目标平台，从第一天起就进 CI；Linux 是协调服务和中继的平台
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo test --workspace --locked
      # wintun 那部分代码只在 Windows 上才编译得到，lint 也只能在这里做
      - if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 真正创建虚拟网卡的测试需要 CAP_NET_ADMIN。编译仍用普通用户，只有运行测试时经 sudo
      - if: runner.os == 'Linux'
        run: cargo test -p meshora-tun --locked -- --ignored
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo

  # 两个网络命名空间模拟两台机器，各跑一个 meshorad，用真的 ping 验证加密隧道：
  # 能直连时走直连，--relay-only 时全程经中继。需要 root，脚本经 sudo 跑
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo build -p meshorad -p meshora-coord --locked
      - run: sudo scripts/e2e-netns.sh target/debug
