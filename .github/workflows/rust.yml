name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支上推了新提交，旧的那次没必要跑完
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# 不做缓存：从头编译整轮也就一分钟左右，不值得为它多引一个 action

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # runner 自带 rustup。不带参数的 install 按 rust-toolchain.toml 装，连同里面列的组件
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 契约写在文档注释里，文档里的断链也要拦下来
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      # 一个平台挂了另一个也要跑完：平台相关的问题正是要看全的
      fail-fast: false
      matrix:
        # Windows 是第一个目标平台，从第一天起就进 CI；Linux 是协调服务和中继的平台
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo test --workspace --locked
      # wintun 那部分代码只在 Windows 上才编译得到，lint 也只能在这里做
      - if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Windows 上真的创建网卡要 wintun.dll。从官网下载，核对压缩包的哈希和 DLL 的签名，
      # 放到测试程序旁边 —— 代码只从可执行文件所在的目录加载它，不走系统搜索路径
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Output "wintun-0.14.1.zip SHA256: $hash"
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $dll = Join-Path $env:RUNNER_TEMP 'wintun\bin\amd64\wintun.dll'
          $sig = Get-AuthenticodeSignature $dll
          Write-Output "wintun.dll signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw 'wintun-0.14.1.zip SHA256 mismatch'
          }
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=WireGuard LLC') {
            throw 'wintun.dll is not validly signed by WireGuard LLC'
          }
          Copy-Item $dll target\debug\deps\
      # 真正创建虚拟网卡的测试需要管理员权限。Linux 上编译仍用普通用户，只有运行测试时经 sudo；
      # Windows 的 runner 本来就以管理员身份运行
      - run: cargo test -p meshora-tun --locked -- --ignored
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo

  # 网络命名空间模拟几台机器和 NAT 路由器，各跑一个 meshorad，用真的 ping 验证加密隧道：
  # 同一网段直连、--relay-only 全程经中继、普通 NAT 后面打洞直连、对称 NAT 后面回退中继。
  # 需要 root，脚本经 sudo 跑
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo build -p meshorad -p meshora-coord --locked
      - run: sudo scripts/e2e-netns.sh target/debug
