name: Desktop

# 打 Windows 桌面客户端的安装包（NSIS），带着核对过哈希和签名的 wintun.dll。编译和 lint 在 Rust 那个工作流里已经做了，
# 这里只管出包 —— 改到客户端时、打标签时、手动触发时才跑
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "scripts/fetch-wintun.ps1"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 打包工具的版本钉死：它会被拿来执行，供应链的账要算清
  TAURI_CLI: "@tauri-apps/cli@2.12.0"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update

      # 安装包的文件名和"程序和功能"里的版本号都取自 Cargo.toml，标签对不上就会发出一个名不副实的版本
      - name: 核对版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ((cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'meshora-desktop').version
          if ("v$version" -ne $env:TAG) {
            Write-Error "标签是 $env:TAG，Cargo.toml 里的版本是 $version：先改版本号再打标签"
            exit 1
          }

      - name: wintun.dll
        shell: pwsh
        run: scripts/fetch-wintun.ps1 -Destination crates\meshora-desktop\wintun

      # tauri.bundle.json 叠在 tauri.conf.json 上：打开打包，装到 Program Files（只有管理员能写，
      # wintun.dll 放在那里才可信），把 wintun.dll 放到 meshora.exe 旁边。
      # 平时的 cargo build 不读它，所以本地编译不需要 wintun.dll
      - name: 安装包
        working-directory: crates/meshora-desktop
        run: npx --yes ${{ env.TAURI_CLI }} build --ci --config tauri.bundle.json

      # 不出免安装的 zip：客户端以管理员身份运行、从自己旁边加载 wintun.dll，
      # 解压到"下载"这类普通用户可写的目录，就等于把管理员权限交给了能写那个目录的任何进程
      - name: 哈希
        shell: pwsh
        working-directory: target/release/bundle/nsis
        run: |
          $sums = Get-ChildItem *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          }
          $sums
          # 不带 BOM、LF 换行：sha256sum -c 能直接读
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($sums -join "`n") + "`n")

      - uses: actions/upload-artifact@v7
        with:
          name: meshora-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  # 打标签时建 Release。建成草稿：安装包没有代码签名、发布前要有人真装一遍，由人检查过再点发布。
  # 0.x 和带 "-" 的版本标成预发布
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: meshora-windows-x64
          path: dist

      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Windows 桌面客户端的安装包（x64），装到 `Program Files`，运行时需要管理员权限（要建虚拟网卡）。

          - **Pre-alpha**：没有经过安全审查，还没在两台真的电脑之间拿真的游戏联机试过
          - **安装包没有代码签名**，SmartScreen 会提示"未知发布者"
          - 没有免安装版，理由见[威胁模型](https://kerxs.github.io/meshora/guide/threat-model)

          下载后核对 SHA-256（和 `SHA256SUMS.txt` 里的对得上再装）：

          ```powershell
          Get-FileHash -Algorithm SHA256 .\Meshora_*_x64-setup.exe
          ```

          用法见[桌面客户端](https://kerxs.github.io/meshora/guide/desktop)。
          EOF
          prerelease=()
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "Meshora $TAG" --notes-file notes.md
