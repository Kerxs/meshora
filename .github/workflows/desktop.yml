name: Desktop

# 打 Windows 桌面客户端的安装包（NSIS），带着核对过哈希和签名的 wintun.dll。编译和 lint 在 Rust 那个工作流里已经做了，
# 这里只管出包 —— 改到客户端时、打标签时、手动触发时才跑
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "scripts/fetch-wintun.ps1"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 打包工具的版本钉死：它会被拿来执行，供应链的账要算清
  TAURI_CLI: "@tauri-apps/cli@2.12.0"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update

      - name: wintun.dll
        shell: pwsh
        run: scripts/fetch-wintun.ps1 -Destination crates\meshora-desktop\wintun

      # tauri.bundle.json 叠在 tauri.conf.json 上：打开打包，装到 Program Files（只有管理员能写，
      # wintun.dll 放在那里才可信），把 wintun.dll 放到 meshora.exe 旁边。
      # 平时的 cargo build 不读它，所以本地编译不需要 wintun.dll
      - name: 安装包
        working-directory: crates/meshora-desktop
        run: npx --yes ${{ env.TAURI_CLI }} build --ci --config tauri.bundle.json

      # 不出免安装的 zip：客户端以管理员身份运行、从自己旁边加载 wintun.dll，
      # 解压到"下载"这类普通用户可写的目录，就等于把管理员权限交给了能写那个目录的任何进程
      - name: 哈希
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          }

      - uses: actions/upload-artifact@v7
        with:
          name: meshora-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
