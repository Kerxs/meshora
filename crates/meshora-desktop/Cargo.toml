[package]
name = "meshora-desktop"
description = "Meshora 的桌面客户端（Windows）：填一个网络码，和朋友组成虚拟局域网"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "meshora"
path = "src/main.rs"
# 可执行文件内嵌了"要求管理员权限"的清单：它的测试程序在普通用户下根本起不来。
# 要测的逻辑都在库里
test = false

[dependencies]
meshorad = { path = "../meshorad" }
meshora-types.workspace = true
meshora-control.workspace = true
meshora-dataplane.workspace = true
meshora-proto.workspace = true
# 本机当主机：协调服务和中继跑在客户端进程里
meshora-coord.workspace = true
meshora-relay.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
igd-next.workspace = true

# 界面只做 Windows（1.0.0 只做 Windows）。别的平台上可执行文件只打一句话，
# Linux 的 CI 也就不必为了编译它装 WebKit。节点的启停、状态汇总不依赖界面，在哪都能编译、能测
[target.'cfg(windows)'.dependencies]
meshora-tun.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true

[target.'cfg(windows)'.build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true
