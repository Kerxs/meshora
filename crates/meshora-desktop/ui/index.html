<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover：手机上让 env(safe-area-inset-*) 生效，状态栏、手势条那里留出空 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meshora</title>
    <!-- Glassium 的兜底样式要赶在脚本之前：没有 GPU 时组件也有一层看得清的表面 -->
    <link rel="stylesheet" href="vendor/glassium/glassium.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- 流体背景：光团由 sky.js 建（样式在 app.css） -->
    <div class="sky" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
