[package]
name = "meshora-tun"
description = "Meshora 的虚拟网卡：Linux 用 /dev/net/tun，Windows 用 wintun，安卓接 VpnService 的描述符。平台相关的 unsafe 集中在这里"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
wintun.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_SystemInformation"] }

[lints]
workspace = true
